# Alternative open-weight backend: vLLM's OpenAI-compatible server.
# vllm serve meta-llama/Llama-3.1-8B-Instruct --enable-auto-tool-choice \
#   --tool-call-parser llama3_json
provider: openai_compat
model_id: meta-llama/Llama-3.1-8B-Instruct
base_url: http://localhost:8000/v1
max_tokens: 1500
use_cache: true
cache_dir: .cache/llm
