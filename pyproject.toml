[project]
name = "cra"
version = "0.1.0"
description = "Clinical reasoning agent with evidence grounding and a hallucination benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.9.2",
    "PyYAML==6.0.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "matplotlib==3.9.2",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "rank-bm25==0.2.2",
    "tenacity==9.0.0",
    "httpx==0.27.2",
    "tqdm==4.67.0",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
# API-backed rollouts.
api = ["anthropic==0.39.0", "openai==1.54.4"]
# Dense retrieval + local NLI entailment. Heavy (pulls torch); optional by design.
dense = ["sentence-transformers==3.2.1", "faiss-cpu==1.9.0", "torch==2.5.1", "transformers==4.46.2"]
# Interactive demo.
demo = ["gradio==5.5.0"]
dev = ["pytest==8.3.3", "pytest-cov==6.0.0", "ruff==0.7.3"]

[project.scripts]
cra = "cra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
